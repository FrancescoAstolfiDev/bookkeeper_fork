name: Java CI

on:
  push:
    branches: [ "master", "main" ] # Evita di far girare il CI su ogni piccolo commit di bozza se non vuoi
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # Ti permette di lanciarlo a mano per testare

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Aggiornato alla v4 (più veloce e sicura)

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4 # Aggiornato alla v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        # AGGIUNTO: -Dmaven.test.skip=true
        # Altrimenti il CI cercherà i test che hai rimosso e fallirà come sulla tua macchina!
        run: mvn clean install -Dmaven.test.skip=true