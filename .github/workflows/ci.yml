name: Java CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        # Utilizziamo -DskipTests per permettere a Maven di generare
        # i metadati necessari, ma saltando l'esecuzione.
        run: mvn clean install -DskipTests -Dcheckstyle.skip -Dspotbugs.skip